spring.application.name=validator-infra

# Banco
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/validator_infra
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenRouter (compatível com OpenAI)
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
# Conferir modelo que aceita imagem em openrouter.ai/models?modality=image
#spring.ai.openai.chat.options.model=google/gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.1

spring.ai.openai.chat.options.model=openrouter/free
spring.ai.openai.chat.options.max-tokens=2000

# Segurança / JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Servidor
server.port=8080

# Armazenamento das fotos (no Docker: /app/storage/fotos, num volume)
app.storage.fotos-path=${FOTOS_PATH:./storage/fotos}

# Actuator: só o health é exposto (público); detalhes não são exibidos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
