spring.application.name=validator-infra

# Banco
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/validator_infra
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini API (Google AI Studio)
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-3.8-flash
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-tokens=4000

# Retry dentro de cada chamada ao modelo: 1 tentativa + 1 retry após 2s (pega pico curto de demanda).
# Atenção: no Spring AI 2.0 max-attempts vira maxRetries, então max-attempts=1 = 2 chamadas HTTP, não 1.
# 429 é 4xx e por padrão não teria retry; on-http-codes o torna transitório (retry + fallback de modelo).
spring.ai.retry.max-attempts=1
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=15s
spring.ai.retry.on-http-codes=429

# Fallback de modelo (FallbackVisionProvider): o primeiro é o principal; cada um recebe N chamadas
# (cada chamada já inclui o retry acima) antes de passar ao próximo.
# Pior caso: 3 modelos x 1 x 2 chamadas HTTP = 6 chamadas.
app.ai.modelos=gemini-3.8-flash,gemini-2.0-flash,gemini-2.5-flash
app.ai.tentativas-por-modelo=1

# Segurança / JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Servidor
server.port=8080

# Armazenamento das fotos (no Docker: /app/storage/fotos, num volume)
app.storage.fotos-path=${FOTOS_PATH:./storage/fotos}

# Upload: fotos de celular têm 5-10MB; o padrão do Spring (1MB) barrava o envio
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Actuator: só o health é exposto (público); detalhes não são exibidos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

